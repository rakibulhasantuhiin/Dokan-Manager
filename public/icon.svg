<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#9a2c09" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Safe zone inner content -->
  <g filter="url(#shadow)" transform="translate(106, 86)">
    <!-- Ledger Book Body -->
    <rect x="20" y="20" width="260" height="320" rx="28" fill="#ffffff" />
    <!-- Book Spine Bindings -->
    <rect x="0" y="20" width="40" height="320" rx="12" fill="#e2e8f0" />
    <circle cx="20" cy="80" r="10" fill="#cbd5e1" />
    <circle cx="20" cy="180" r="10" fill="#cbd5e1" />
    <circle cx="20" cy="280" r="10" fill="#cbd5e1" />
    
    <!-- Ledger Bookmark Ribbon -->
    <path d="M70,20 L70,110 L95,85 L120,110 L120,20 Z" fill="#ea580c" />
    
    <!-- Shop / Calculator / Taka lines -->
    <!-- Taka Symbol / Ledger lines -->
    <rect x="70" y="140" width="170" height="18" rx="9" fill="#fed7aa" />
    <rect x="70" y="176" width="130" height="16" rx="8" fill="#ffedd5" />
    
    <!-- Taka ৳ Symbol Badge -->
    <circle cx="150" cy="250" r="46" fill="#c2410c" />
    <text x="150" y="268" font-family="'Hind Siliguri', 'Noto Sans Bengali', Arial, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle">৳</text>
  </g>
</svg>
